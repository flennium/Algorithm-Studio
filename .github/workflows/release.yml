name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item release/Algorithm-Studio-Setup-*.exe
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "release/$($installer.Name).sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Algorithm-Studio-Setup-*.exe
            release/Algorithm-Studio-Setup-*.exe.sha256
