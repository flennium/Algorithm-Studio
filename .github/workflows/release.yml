name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-Item release/Algorithm-Studio-Setup-*.exe
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "release/$($installer.Name).sha256"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item release/Algorithm-Studio-Setup-*.exe
          $checksum = Get-Item release/Algorithm-Studio-Setup-*.exe.sha256
          gh release create $env:GITHUB_REF_NAME $installer.FullName $checksum.FullName --generate-notes --title "Algorithm Studio $env:GITHUB_REF_NAME"
